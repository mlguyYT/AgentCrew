name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n bin/agentcrew
          for script in agent-team/tools/*.sh; do
            bash -n "$script"
          done
          ./bin/agentcrew loader --root "$PWD" > /dev/null

      - name: Python syntax
        run: python3 -m py_compile engine/agentcrew/*.py

      - name: Install engine test dependencies
        run: python3 -m pip install -e "./engine[dev]"

      - name: Install command isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Verify command isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from agentcrew.command_sandbox import sandbox_command
          subprocess.run(sandbox_command(Path.cwd(), ["/usr/bin/true"]), check=True)
          PY

      - name: Engine tests
        run: python3 -m pytest engine/tests

      - name: AgentCrew doctor
        run: ./bin/agentcrew doctor
