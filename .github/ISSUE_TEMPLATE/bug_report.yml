name: Bug report
description: Report a defect or regression.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can this be reproduced?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or evidence
      description: Paste relevant output.
    validations:
      required: false

  - type: dropdown
    id: risk
    attributes:
      label: Risk / impact
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
