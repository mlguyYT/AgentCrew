<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">AgentCrew workflow</title>
  <desc id="desc">A user request is classified into a lane, routed through focused roles, handed off through compact artifacts, and stopped at a human approval gate.</desc>

  <defs>
    <style><![CDATA[
      .bg { fill: #ffffff; }
      .band { fill: #f6f8fb; }
      .card { fill: #ffffff; stroke: #ccd6e3; stroke-width: 2; }
      .route { fill: #eaf4ff; stroke: #7fb2ef; stroke-width: 2.25; }
      .role { fill: #f0f8ef; stroke: #90c386; stroke-width: 2.25; }
      .gate { fill: #fff3d6; stroke: #dca52d; stroke-width: 2.25; }
      .ink,
      .muted {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .ink { fill: #08111f; }
      .muted { fill: #314155; }
      .headline { font-size: 36px; font-weight: 700; letter-spacing: 0; }
      .subtitle { font-size: 19px; font-weight: 500; }
      .label { font-size: 24.5px; font-weight: 700; letter-spacing: 0; }
      .body { font-size: 17.5px; font-weight: 500; }
      .small { font-size: 16.5px; font-weight: 600; }
      .center { text-anchor: middle; }
      .arrow { stroke: #5f7086; stroke-width: 3.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>

    <marker id="arrowhead" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3,3 L14,8 L3,13 Z" fill="#5f7086"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="520"/>
  <rect class="band" x="32" y="34" width="1216" height="452" rx="22"/>

  <text class="ink headline" x="72" y="88">AgentCrew routes normal chat into a disciplined delivery loop</text>
  <text class="muted subtitle" x="72" y="122">Users ask for the outcome. AgentCrew chooses the lane, roles, Skills, gates, and next human approval point.</text>

  <rect class="card" x="72" y="174" width="180" height="104" rx="10"/>
  <text class="ink label center" x="162" y="222">User asks</text>
  <text class="muted body center" x="162" y="254">plain language</text>

  <path class="arrow" d="M252 226 H310" marker-end="url(#arrowhead)"/>

  <rect class="route" x="322" y="162" width="190" height="128" rx="10"/>
  <text class="ink label center" x="417" y="209">Classify</text>
  <text class="muted body center" x="417" y="241">risk, lane, recipe</text>
  <text class="muted body center" x="417" y="266">Skills and gates</text>

  <path class="arrow" d="M512 226 H570" marker-end="url(#arrowhead)"/>

  <rect class="role" x="582" y="144" width="606" height="164" rx="10"/>
  <text class="ink label center" x="885" y="188">Focused role chain</text>

  <rect class="card" x="618" y="210" width="94" height="54" rx="8"/>
  <text class="ink small center" x="665" y="243">PM</text>

  <path class="arrow" d="M712 237 H748" marker-end="url(#arrowhead)"/>

  <rect class="card" x="758" y="210" width="112" height="54" rx="8"/>
  <text class="ink small center" x="814" y="243">Developer</text>

  <path class="arrow" d="M870 237 H906" marker-end="url(#arrowhead)"/>

  <rect class="card" x="916" y="210" width="92" height="54" rx="8"/>
  <text class="ink small center" x="962" y="243">Tester</text>

  <path class="arrow" d="M1008 237 H1042" marker-end="url(#arrowhead)"/>

  <rect class="card" x="1052" y="210" width="116" height="54" rx="8"/>
  <text class="ink small center" x="1110" y="243">Reviewer</text>

  <text class="muted body center" x="885" y="291">Specialists join only when triggered.</text>

  <rect class="card" x="550" y="370" width="296" height="76" rx="10"/>
  <text class="ink label center" x="698" y="407">Compact handoff</text>
  <text class="muted body center" x="698" y="435">evidence, decision, next action</text>

  <path class="arrow" d="M885 308 V334 H698 V358" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M846 408 H900" marker-end="url(#arrowhead)"/>

  <rect class="gate" x="914" y="360" width="250" height="96" rx="10"/>
  <text class="ink label center" x="1039" y="400">Human gate</text>
  <text class="muted body center" x="1039" y="432">approval, risk, merge</text>
</svg>
