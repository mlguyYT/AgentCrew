<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AgentCrew workflow</title>
  <desc id="desc">A user asks normally in their coding agent. AgentCrew routes the request to the right roles, runs the work, and stops at human approval.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .primary { fill: #1f5eff; }
      .ink { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #536174; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 21px; }
      .body { font-size: 24px; }
      .head { font-size: 34px; font-weight: 700; }
      .role { font-size: 23px; font-weight: 700; }
      .arrow { stroke: #5f6f87; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .chip { fill: #eef3ff; stroke: #c7d7ff; stroke-width: 2; }
      .gate { fill: #fff8e8; stroke: #f0c76a; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5f6f87"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="560" rx="0"/>

  <text class="ink head" x="60" y="68">AgentCrew turns one agent chat into a disciplined team workflow</text>
  <text class="muted body" x="60" y="106">The user asks normally. AgentCrew chooses the right role, lane, skills, gates, and human approval point.</text>

  <rect class="panel" x="60" y="160" width="230" height="130" rx="16"/>
  <text class="ink role" x="88" y="210">User</text>
  <text class="muted small" x="88" y="244">"Build this idea"</text>
  <text class="muted small" x="88" y="272">or "fix this bug"</text>

  <path class="arrow" d="M300 225 H390" marker-end="url(#arrowhead)"/>

  <rect class="panel" x="410" y="145" width="300" height="160" rx="16"/>
  <text class="ink role" x="440" y="196">AgentCrew router</text>
  <text class="muted small" x="440" y="232">Classify request</text>
  <text class="muted small" x="440" y="260">Choose lane and role</text>
  <text class="muted small" x="440" y="288">Load only needed context</text>

  <path class="arrow" d="M720 225 H805" marker-end="url(#arrowhead)"/>

  <rect class="panel" x="830" y="120" width="310" height="250" rx="16"/>
  <text class="ink role" x="860" y="168">Roles run as needed</text>

  <rect class="chip" x="860" y="195" width="112" height="42" rx="21"/>
  <text class="ink small" x="884" y="223">Advisor</text>

  <rect class="chip" x="988" y="195" width="104" height="42" rx="21"/>
  <text class="ink small" x="1016" y="223">PM</text>

  <rect class="chip" x="860" y="252" width="126" height="42" rx="21"/>
  <text class="ink small" x="883" y="280">Developer</text>

  <rect class="chip" x="1000" y="252" width="96" height="42" rx="21"/>
  <text class="ink small" x="1023" y="280">Tester</text>

  <rect class="chip" x="860" y="309" width="122" height="42" rx="21"/>
  <text class="ink small" x="883" y="337">Reviewer</text>

  <rect class="chip" x="997" y="309" width="118" height="42" rx="21"/>
  <text class="ink small" x="1022" y="337">Security</text>

  <path class="arrow" d="M985 370 V420" marker-end="url(#arrowhead)"/>

  <rect class="gate" x="795" y="430" width="380" height="78" rx="16"/>
  <text class="ink role" x="830" y="478">Human approval stays final</text>

  <rect class="panel" x="420" y="365" width="285" height="115" rx="16"/>
  <text class="ink role" x="450" y="410">Cost preview</text>
  <text class="muted small" x="450" y="446">Estimate before execution</text>

  <path class="arrow" d="M565 305 V350" marker-end="url(#arrowhead)"/>
</svg>
