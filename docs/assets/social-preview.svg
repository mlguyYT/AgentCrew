<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AgentCrew social preview</title>
  <desc id="desc">AgentCrew turns a coding agent chat into a disciplined software team with routing, roles, Skills, gates, and human approval.</desc>
  <defs>
    <style>
      .bg { fill: #111827; }
      .panel { fill: #ffffff; opacity: 0.11; }
      .ink { fill: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #e2e8f0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .accent { fill: #bfdbfe; }
      .green { fill: #bbf7d0; }
      .gold { fill: #fde68a; }
      .buttonText { fill: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 86px; font-weight: 800; }
      .tag { font-size: 36px; font-weight: 500; }
      .label { font-size: 25px; font-weight: 700; }
      .side { font-size: 27px; font-weight: 700; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="640"/>
  <rect class="panel" x="64" y="64" width="1152" height="512" rx="32"/>

  <text class="ink title" x="112" y="205">AgentCrew</text>
  <text class="muted tag" x="116" y="270">Turn your coding agent into a disciplined software team.</text>
  <text class="muted tag" x="116" y="330">Roles. Playbooks. Skills. Gates. Human approval.</text>

  <rect class="accent" x="128" y="414" width="150" height="58" rx="12"/>
  <text class="buttonText label center" x="203" y="452">Route</text>

  <rect class="green" x="316" y="414" width="150" height="58" rx="12"/>
  <text class="buttonText label center" x="391" y="452">Build</text>

  <rect class="gold" x="504" y="414" width="150" height="58" rx="12"/>
  <text class="buttonText label center" x="579" y="452">Approve</text>

  <text class="muted side" x="820" y="447">Markdown-first</text>
  <text class="muted side" x="820" y="490">Vendor-neutral</text>
</svg>
